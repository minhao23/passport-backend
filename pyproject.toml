[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Inference stubs must be installed before importing the backend in this suite.
"tests/test_processing_cancellation.py" = ["E402"]
